[package]
name = "deepseek-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2.2"
wasmi = "2.0.0"
portable-pty = "0.9"
ctrlc = "3"